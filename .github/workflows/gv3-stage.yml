name: gv3-stage
run-name: gv3-stage ${{ inputs.stage_url }}
on:
  workflow_dispatch:
    inputs:
      stage_url:
        description: stage URL
        required: true
jobs:
  stage-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - run: echo "testing ${{ inputs.stage_url }} at $GITHUB_SHA"
      - env:
          GH_TOKEN: ${{ github.token }}
          STAGE_URL: ${{ inputs.stage_url }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"stage-status\",\"target_url\":\"${STAGE_URL}\",\"description\":\"stage tests passed\"}" >/dev/null
